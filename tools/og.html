<!doctype html>
<!-- The link preview: images/retsurf-og.png is this page's 1200x630 screenshot. -->
<html lang="en" data-theme="dusk">
<head>
  <meta charset="utf-8">
  <title>retsurf link preview</title>
  <link rel="stylesheet" href="../brand.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .hero { height: 630px; padding: 0; }
    .card { position: relative; padding: 84px 88px 0; }
    .mark { color: var(--ink); font: 128px/1 var(--mono); letter-spacing: -0.02em; }
    .line { margin: 26px 0 0; font: 700 46px/1.15 var(--mono); }
    .sub { margin: 18px 0 0; color: var(--dim); font-size: 26px; }
    .horizon { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <div class="mark">ret<span class="accent">surf</span></div>
      <p class="line">Web browser on <span class="accent">your handheld</span></p>
      <p class="sub">Retro handhelds &middot; Android &middot; Windows &middot; macOS &middot; Linux</p>
    </div>
    <div class="horizon">
      <div class="sun"></div>
      <div class="sea sea-back"></div>
      <div class="sea sea-mid"></div>
      <div class="sea sea-front"></div>
      <div class="surfer"></div>
    </div>
  </section>
</body>
</html>
